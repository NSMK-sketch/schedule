services:
  schedule:
    build: .
    image: schedule:prod
    ports:
      - "5050:8000"
    environment:
      DATABASE: /data/schedule.db
      # За reverse proxy с HTTPS:
      # COOKIE_SECURE: "1"
      # TRUST_PROXY: "1"
    volumes:
      - schedule-data:/data
    restart: unless-stopped

volumes:
  schedule-data:
