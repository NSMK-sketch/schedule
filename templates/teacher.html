<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Расписание преподавателя — НСМК</title>
    <link rel="icon" href="{{ url_for('static', filename='Logo.ico') }}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='student.css') }}?v=11">
</head>
<body>
    <div class="student-bg" aria-hidden="true"></div>

    <header class="student-top">
        <a class="student-logo-link" href="https://nmt54.ru/" rel="home">
            <img
                class="student-logo"
                src="{{ url_for('static', filename='img/nsmk-logo.png') }}?v=9"
                alt="НСМК"
            >
        </a>
        <div class="student-heading">
            <span class="student-title">Расписание занятий</span>
            <a class="audience-link" href="/">Студентам</a>
        </div>
    </header>

    <main class="student-main">
        <section class="student-controls">
            <label class="field">
                <span>Преподаватель</span>
                <select id="teacher-select" aria-label="Выбор преподавателя">
                    <option value="">Выберите преподавателя…</option>
                </select>
            </label>

            <div class="week-switch" role="group" aria-label="Учебная неделя">
                <button type="button" class="week-btn active" data-week="1">1-я неделя</button>
                <button type="button" class="week-btn" data-week="2">2-я неделя</button>
            </div>
        </section>

        <section id="teacher-meta" class="group-meta hidden"></section>
        <section id="schedule-root" class="schedule-root">
            <div class="empty-state">
                <p>Выберите преподавателя — расписание откроется ниже.</p>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='teacher.js') }}?v=1"></script>
</body>
</html>
