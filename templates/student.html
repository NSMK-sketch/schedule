<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Расписание студентов — НСМК</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='student.css') }}?v=10">
</head>
<body>
    <div class="student-bg" aria-hidden="true"></div>

    <header class="student-top">
        <a class="student-logo-link" href="https://nmt54.ru/" rel="home">
            <img
                class="student-logo"
                src="{{ url_for('static', filename='img/nsmk-logo.png') }}?v=9"
                alt="НСМК"
            >
        </a>
        <span class="student-title">Расписание занятий</span>
    </header>

    <main class="student-main">
        <section class="student-controls">
            <label class="field">
                <span>Группа</span>
                <select id="group-select" aria-label="Выбор группы">
                    <option value="">Выберите группу…</option>
                </select>
            </label>

            <div class="week-switch" role="group" aria-label="Учебная неделя">
                <button type="button" class="week-btn active" data-week="1">1-я неделя</button>
                <button type="button" class="week-btn" data-week="2">2-я неделя</button>
            </div>
        </section>

        <section id="group-meta" class="group-meta hidden"></section>
        <section id="schedule-root" class="schedule-root">
            <div class="empty-state">
                <p>Выберите свою группу — расписание откроется ниже.</p>
            </div>
        </section>
    </main>

    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script src="{{ url_for('static', filename='student.js') }}?v=11"></script>
</body>
</html>
