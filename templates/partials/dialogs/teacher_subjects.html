<dialog id="teacher-subjects-dialog" class="dialog">
    <form id="teacher-subjects-form" class="dialog-card">
        <header class="dialog-header">
            <div>
                <div class="eyebrow">Преподаватель</div>
                <h2>Дисциплины преподавателя</h2>
                <p id="teacher-subjects-title" class="muted"></p>
            </div>
            <button type="button" class="icon-button" data-close>×</button>
</header>

        <input id="teacher-subjects-teacher-id" type="hidden">
        <div id="teacher-subjects-fields" class="checkbox-list"></div>

        <footer class="dialog-actions">
            <span></span>
            <button type="button" class="button button-secondary" data-close>Отмена</button>
            <button class="button button-primary">Сохранить</button>
        </footer>
    </form>
</dialog>
