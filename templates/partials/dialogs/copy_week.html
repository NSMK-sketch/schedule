<dialog id="copy-week-dialog" class="dialog">
    <form id="copy-week-form" class="dialog-card">
        <header class="dialog-header">
            <div>
                <div class="eyebrow">Расписание</div>
                <h2>Копирование расписания</h2>
            </div>
            <button type="button" class="icon-button" data-close>×</button>
</header>

        <p class="muted">
            Все занятия выбранной недели будут скопированы на другую неделю.
            Существующие занятия в целевой неделе будут перезаписаны.
        </p>

        <div class="form-grid">
            <label>Копировать из
                <select id="copy-source-week">
                    <option value="1">1-я неделя</option>
                    <option value="2">2-я неделя</option>
                </select>
            </label>
            <label>Копировать в
                <select id="copy-target-week">
                    <option value="2">2-я неделя</option>
                    <option value="1">1-я неделя</option>
                </select>
            </label>
        </div>

        <footer class="dialog-actions">
            <span></span>
            <button type="button" class="button button-secondary" data-close>Отмена</button>
            <button class="button button-primary">Копировать</button>
        </footer>
    </form>
</dialog>
