<dialog id="confirm-dialog" class="dialog confirm-dialog">
    <form id="confirm-form" class="dialog-card confirm-card">
        <header class="dialog-header">
            <div>
                <div class="eyebrow">Подтверждение</div>
                <h2 id="confirm-title">Удаление</h2>
            </div>
            <button type="button" class="icon-button" data-confirm-cancel>×</button>
</header>

        <p id="confirm-message" class="confirm-message"></p>

        <footer class="dialog-actions">
            <span></span>
            <button type="button" class="button button-secondary" data-confirm-cancel>Отмена</button>
            <button type="submit" class="button button-danger">Удалить</button>
        </footer>
    </form>
</dialog>
