<section id="login-screen" class="login-screen">
    <div class="login-card">
        <div class="brand brand-large">
            <div class="brand-mark">Н</div>
            <div>
                <strong>Расписание</strong>
                <span>Учебный планировщик</span>
            </div>
        </div>

        <div class="eyebrow">НСМК · расписание</div>
        <h1>Вход в систему</h1>
        <p class="muted">
            Войдите под своей учётной записью для просмотра или управления расписанием.
        </p>

        <form id="login-form" class="stack">
            <label>
                Логин
                <input id="login-username" autocomplete="username" required>
            </label>
            <label>
                Пароль
                <input id="login-password" type="password" autocomplete="current-password" required>
            </label>
            <button class="button button-primary" type="submit">Войти</button>
        </form>

        <p class="muted" style="margin-top: 14px; text-align: center;">
            Студентам вход не нужен —
            <a href="/student" style="color: var(--primary); font-weight: 700; text-decoration: none;">открыть расписание</a>
        </p>
    </div>
</section>
